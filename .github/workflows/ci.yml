name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Comprobar que el servidor arranca
        run: |
          APP_PASSWORD=ci-test-12345 PORT=8799 node server.js &
          sleep 3
          curl -fsS http://127.0.0.1:8799/api/health
          kill %1
